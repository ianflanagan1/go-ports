# Generated by go-baseline from go.mod. Don't edit: change the baseline, then
# run `go tool go-baseline write`.
# Module kind: pure-library. Change it with `go tool go-baseline write -kind <kind>`.
version: "2"

run:
  # Lint the integration tests too.
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - exhaustive
    - forbidigo
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - gosec
    - modernize
    - revive
    - testpackage
    - wrapcheck
  settings:
    depguard:
      rules:
        # A pure library is all functional core: pure functions over values.
        # It imports only the standard library's pure packages and
        # third-party libraries.
        core:
          list-mode: lax
          files:
            - $all
            - "!$test"
          allow:
            - net/mail
            - net/netip
            - net/url
          deny:
            - pkg: context
              desc: the core takes values, not a context; I/O happens in the shell
            - pkg: log
              desc: the core does no I/O
            - pkg: crypto/rand
              desc: the core does no I/O
            - pkg: database/sql
              desc: the core does no I/O
            - pkg: io/ioutil
              desc: the core does no I/O
            - pkg: math/rand
              desc: the core does no I/O
            - pkg: net
              desc: the core does no I/O
            - pkg: os
              desc: the core does no I/O
            - pkg: plugin
              desc: the core does no I/O
            - pkg: syscall
              desc: the core does no I/O
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustive:
      default-signifies-exhaustive: false
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.(Now|Since|Until|Sleep|After|AfterFunc|Tick|NewTimer|NewTicker)$
          msg: the clock is an adapter; take it through a port
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
          msg: printing is I/O; write through an io.Writer port
        - pattern: ^log\.(Print|Fatal|Panic)(f|ln)?$
          msg: the global logger is I/O; take a *slog.Logger
        - pattern: ^slog\.((Debug|Info|Warn|Error)(Context)?|Log|LogAttrs|Default|SetDefault)$
          msg: the global logger is I/O; take a *slog.Logger
    funlen:
      lines: 50
      statements: 30
    gochecksumtype:
      default-signifies-exhaustive: false
    gocognit:
      min-complexity: 10
    govet:
      enable:
        - nilness
    revive:
      enable-default-rules: true
      rules:
        - name: exported
    wrapcheck:
      # The module's own packages wrap their errors with context; wrap those
      # from other modules where they come in.
      ignore-package-globs:
        - github.com/ianflanagan1/go-ports/*
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - forbidigo
          - funlen
          - gocognit
          - gosec
          - wrapcheck
      - path: (^|/)(cmd|adapters)/
        linters:
          - forbidigo
      # Running commands and opening files by name is what adapters and the
      # composition root are for.
      - path: (^|/)(cmd|adapters)/
        text: G204|G304
        linters:
          - gosec
      # Adapters and the composition root are kept thin and small; the core
      # and shell are limited by their own rules instead.
      - path-except: (^|/)(cmd|adapters)/
        linters:
          - funlen

formatters:
  enable:
    - gofumpt
    - goimports
